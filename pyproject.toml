[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-harness"
version = "0.1.0"
description = "An agent runtime that resumes from a journal so side-effecting tool calls take effect once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.17,<0.18"]

[tool.setuptools.packages.find]
include = ["harness*", "agents*", "platform_sim*", "chaos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP042"]  # keep the (str, Enum) classes: StrEnum changes their str() and format()

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["agents.campaign.CampaignGoal"]  # a frozen dataclass
